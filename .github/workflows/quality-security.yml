name: Quality and security

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify fight registry regressions
        run: node fight-registry-regression.test.js
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Verify unattended Growth Engine controller offline scenarios
        run: node growth-unattended-controller.test.js && node growth-unattended-store.test.js
      - name: Verify real isolated MongoDB job recovery
        env:
          GROWTH_TEST_MONGO_URI: mongodb://127.0.0.1:27017
        run: node growth-unattended-mongo.integration.test.js
      - run: npm audit --omit=dev --audit-level=high
      - uses: gitleaks/gitleaks-action@v2
        if: ${{ always() && !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
