name: Commit verified candidate lockfile (isolated)
on:
  push:
    branches:
      - security/growth-dependency-remediation
    paths:
      - '.github/workflows/commit-repair-lockfile.yml'
permissions:
  contents: write
jobs:
  commit-lockfile:
    if: github.repository == 'WajihulHassan944/fantasymmadness-game-server-three' && github.ref == 'refs/heads/security/growth-dependency-remediation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate candidate lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Validate locked patched versions
        run: |
          node -e "const p=require('./package-lock.json').packages; if(p['node_modules/sharp'].version!=='0.35.5'||!/^4\\.(?:[6-9]|[1-9][0-9])\\./.test(p['node_modules/zod'].version)) process.exit(1)"
          npm ci --ignore-scripts
          npm test
          npm audit --omit=dev --audit-level=high
      - name: Commit lockfile only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Lock tested patched sharp and zod dependencies"
            git push origin HEAD:security/growth-dependency-remediation
          fi
