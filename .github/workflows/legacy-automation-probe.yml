name: TEST ONLY legacy automation public probe (read-only)
on:
  push:
    branches: [test/legacy-automation-audit]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read-only public probe of the live site
        run: node growth-acceptance/legacy-automation-probe.js
