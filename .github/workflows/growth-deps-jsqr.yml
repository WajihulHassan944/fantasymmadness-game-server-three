name: deps - add jsqr (QR decoder for poster verification)
on:
  push:
    branches: [test/growth-deps-jsqr]
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Add jsqr to package.json + package-lock (no other changes)
        run: |
          npm install jsqr@1.4.0 --save-exact --package-lock-only --ignore-scripts --no-fund --no-audit
          git diff --stat
          npm ci --ignore-scripts --no-fund --no-audit && node -e "console.log(typeof require('jsqr'))"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q .github/workflows/growth-deps-jsqr.yml
          git add package.json package-lock.json
          git commit -m "deps: add jsqr 1.4.0 (decode poster QR codes from the rendered image)"
          git push origin HEAD:test/growth-deps-jsqr
