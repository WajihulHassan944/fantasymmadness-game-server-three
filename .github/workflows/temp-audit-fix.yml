name: TEMP security audit analysis and safe fix

# TEMPORARY (removed before review). Records the full npm audit report, then
# applies ONLY semver-compatible fixes (`npm audit fix`, never --force) and
# commits the lockfile to this repair branch for review.
on:
  pull_request:
    paths: ['.github/workflows/temp-audit-fix.yml']

permissions:
  contents: write

jobs:
  audit:
    if: github.head_ref == 'repair/ci-security-audit'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - name: Report audit before
        run: |
          npm audit --json > /tmp/before.json || true
          cat > /tmp/report.js <<'JS'
          const a = require(process.argv[2]); const v = Object.values(a.vulnerabilities || {});
          const fix = (x) => x.fixAvailable === true ? 'compatible fix' : x.fixAvailable ? `${x.fixAvailable.name}@${x.fixAvailable.version}${x.fixAvailable.isSemVerMajor ? ' (BREAKING)' : ''}` : 'no fix';
          const via = (x) => [].concat(x.via).map((y) => typeof y === 'string' ? y : `${y.name} ${y.range} "${String(y.title).slice(0, 70)}" ${y.url || ''}`).join(' ; ');
          const lines = v.sort((p, q) => p.severity.localeCompare(q.severity)).map((x) => `${x.severity.toUpperCase()} ${x.name} [${x.isDirect ? 'direct' : 'transitive'}] range ${x.range} | fix: ${fix(x)} | via: ${via(x)}`);
          const m = a.metadata?.vulnerabilities || {};
          console.log(`::notice title=${process.argv[3]} totals::${JSON.stringify(m)}`);
          for (let i = 0; i < lines.length; i += 4) console.log(`::notice title=${process.argv[3]} ${i / 4 + 1}::${lines.slice(i, i + 4).join('%0A').replace(/\r/g, '')}`);
          JS
          node /tmp/report.js /tmp/before.json "Audit BEFORE"
          for p in proxy-addr body-parser follow-redirects zod sharp @vercel/oidc @vercel/functions @vercel/cli-config express axios; do echo "== $p"; npm ls "$p" --all 2>/dev/null | grep -E "$p@" | sed 's/^[^a-z@]*//' | sort -u | head -6; done > /tmp/tree.txt
          echo "::notice title=Dependency paths::$(sed 's/%/%25/g' /tmp/tree.txt | tr '\n' '\r' | sed 's/\r/%0A/g')"
          for p in zod @vercel/cli-config @vercel/oidc @vercel/functions sharp; do echo "$p latest=$(npm view $p version) deps=$(npm view $p dependencies --json 2>/dev/null | tr -d '\n ' | head -c 300)"; done > /tmp/meta.txt
          echo "::notice title=Registry metadata::$(sed 's/%/%25/g' /tmp/meta.txt | tr '\n' '\r' | sed 's/\r/%0A/g')"
      - name: Apply compatible fixes only (no --force)
        run: |
          npm audit fix --ignore-scripts || true
          npm audit --json > /tmp/after.json || true
          node /tmp/report.js /tmp/after.json "Audit AFTER compatible fix"
          git diff --stat
          echo "::notice title=Changed versions::$(git diff -U0 package-lock.json | grep -E '^[-+]\s+"version"|^@@|node_modules/' | grep -B1 '"version"' | grep -vE '^--$' | sed 's/%/%25/g' | tr '\n' '\r' | sed 's/\r/%0A/g' | head -c 60000)"
          echo "::notice title=package.json diff::$(git diff package.json | sed 's/%/%25/g' | tr '\n' '\r' | sed 's/\r/%0A/g')"
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "Security: npm audit fix (semver-compatible updates only, no --force)"
            git push origin HEAD:${{ github.head_ref }}
          fi
